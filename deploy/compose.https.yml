# Optional overlay for a future domain. Keep ALLOW_HTTP=false and BIND_ADDRESS=127.0.0.1.
services:
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [web]
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
