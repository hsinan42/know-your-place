services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes: [finance-postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  api:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX gerekli}-api:${IMAGE_TAG:?IMAGE_TAG gerekli}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli}
      ADMIN_PASSWORD_MIN_LENGTH: ${ADMIN_PASSWORD_MIN_LENGTH:-12}
      ASPNETCORE_ENVIRONMENT: Production
      ALLOW_HTTP: ${ALLOW_HTTP:-false}
      ConnectionStrings__Finance: "Host=db;Database=finance;Username=finance;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}"
      SQLITE_IMPORT_PATH: ${SQLITE_IMPORT_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    volumes: [finance-data:/data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  web:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX gerekli}-web:${IMAGE_TAG:?IMAGE_TAG gerekli}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"]
volumes:
  finance-data:
  finance-postgres:
